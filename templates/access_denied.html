{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Access Denied</title>
    <link href="{% static 'fonts/inter-400.css' %}" rel="stylesheet">
<style>
* { margin:0; padding:0; box-sizing:border-box; }
body {
    font-family:'Inter',sans-serif; background:#000000; color:#fff;
    min-height:100vh; display:flex; align-items:center; justify-content:center;
}
.card {
    text-align:center; padding:48px; max-width:440px;
}
.card img { width:180px; height:auto; margin-bottom:24px; opacity:0.9; }
.card h1 { font-size:28px; font-weight:700; margin-bottom:8px; }
.card p { font-size:15px; color:#94a3b8; margin-bottom:32px; line-height:1.5; }
.redirect-msg { font-size:13px; color:#64748b; }
.redirect-msg span { color:#38bdf8; font-weight:600; }
.spinner { display:inline-block; width:18px; height:18px; border:3px solid rgba(255,255,255,0.1); border-top-color:#38bdf8; border-radius:50%; animation:spin 0.8s linear infinite; vertical-align:middle; margin-right:8px; }
@keyframes spin { to { transform:rotate(360deg); } }
</style>
</head>
<body>
<div class="card">
    <img src="/media/system_assets/denied.gif" alt="Access Denied">
    <h1>Access Denied</h1>
    <p>You do not have permission to access this page. Please log in with the appropriate credentials.</p>
    <div class="redirect-msg">
        <div class="spinner"></div>
        Redirecting to login in <span id="countdown">5</span> seconds...
    </div>
</div>
<script>
let sec = 5;
const el = document.getElementById('countdown');
const params = new URLSearchParams(window.location.search);
const next = params.get('next') || '';
const t = setInterval(() => {
    sec--;
    el.textContent = sec;
    if (sec <= 0) {
        clearInterval(t);
        window.location.href = '/' + (next ? '?next=' + encodeURIComponent(next) : '');
    }
}, 1000);
</script>
</body>
</html>
